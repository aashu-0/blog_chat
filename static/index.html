<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>RAG Blog Chat</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #f0f2f5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
    }

    .container { width: 100%; max-width: 760px; display: flex; flex-direction: column; gap: 1rem; }

    h1 { font-size: 1.6rem; font-weight: 700; color: #111; }
    p.sub { font-size: 0.9rem; color: #666; margin-top: 0.25rem; }

    /* URL loader */
    .url-card {
      background: white;
      border-radius: 12px;
      padding: 1.25rem;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    .url-row { display: flex; gap: 0.5rem; }
    .url-row input {
      flex: 1;
      padding: 0.6rem 1rem;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.15s;
    }
    .url-row input:focus { border-color: #6366f1; }

    .btn {
      padding: 0.6rem 1.2rem;
      background: #6366f1;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 500;
      transition: background 0.15s;
      white-space: nowrap;
    }
    .btn:hover:not(:disabled) { background: #4f46e5; }
    .btn:disabled { background: #a5b4fc; cursor: not-allowed; }
    .btn.danger { background: #ef4444; }
    .btn.danger:hover:not(:disabled) { background: #dc2626; }

    #status {
      font-size: 0.85rem;
      color: #6b7280;
      min-height: 1.2em;
    }
    #status.success { color: #16a34a; }
    #status.error   { color: #dc2626; }

    /* Chat area */
    #chat-card {
      display: none;
      background: white;
      border-radius: 12px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
      flex-direction: column;
      overflow: hidden;
    }

    .chat-header {
      padding: 0.85rem 1.25rem;
      border-bottom: 1px solid #e5e7eb;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .chat-header span { font-size: 0.85rem; color: #6b7280; }

    #messages {
      padding: 1rem;
      min-height: 320px;
      max-height: 480px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .msg {
      padding: 0.65rem 0.9rem;
      border-radius: 10px;
      max-width: 80%;
      font-size: 0.9rem;
      line-height: 1.55;
      white-space: pre-wrap;
    }
    .msg.user {
      background: #6366f1;
      color: white;
      align-self: flex-end;
      border-bottom-right-radius: 2px;
    }
    .msg.bot {
      background: #f3f4f6;
      color: #111;
      align-self: flex-start;
      border-bottom-left-radius: 2px;
    }
    .msg.thinking { color: #9ca3af; font-style: italic; }

    .input-row {
      padding: 0.75rem 1rem;
      border-top: 1px solid #e5e7eb;
      display: flex;
      gap: 0.5rem;
    }
    .input-row input {
      flex: 1;
      padding: 0.6rem 1rem;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.15s;
    }
    .input-row input:focus { border-color: #6366f1; }
  </style>
</head>
<body>
  <div class="container">

    <div>
      <h1>💬 RAG Blog Chat</h1>
      <p class="sub">Paste any blog URL, load it, then ask questions about its content.</p>
    </div>

    <!-- URL Loader -->
    <div class="url-card">
      <div class="url-row">
        <input id="url-input" type="url"
               placeholder="https://lilianweng.github.io/posts/2023-06-23-agent/" />
        <button class="btn" id="load-btn" onclick="loadBlog()">Load Blog</button>
      </div>
      <div id="status">Enter a blog URL above to get started.</div>
    </div>

    <!-- Chat -->
    <div id="chat-card">
      <div class="chat-header">
        <span id="chat-label">Chatting about: —</span>
        <button class="btn danger" style="padding:0.4rem 0.8rem; font-size:0.8rem"
                onclick="clearSession()">Clear Session</button>
      </div>
      <div id="messages"></div>
      <div class="input-row">
        <input id="q-input" type="text"
               placeholder="Ask a question about this blog post..."
               onkeydown="if(event.key==='Enter') sendQuestion()" />
        <button class="btn" id="send-btn" onclick="sendQuestion()">Send</button>
      </div>
    </div>

  </div>

  <script>
    let sessionId = null;
    // Conversation history sent to backend for multi-turn context
    let history = [];

    async function loadBlog() {
      const url = document.getElementById("url-input").value.trim();
      if (!url) return;

      const loadBtn = document.getElementById("load-btn");
      const status  = document.getElementById("status");

      loadBtn.disabled = true;
      setStatus("⏳ Fetching and indexing blog — this may take a few seconds...", "");

      try {
        const res  = await fetch("/load", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ url }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail);

        sessionId = data.session_id;
        history   = [];

        setStatus(`✅ ${data.message}`, "success");
        document.getElementById("chat-label").textContent = `Chatting about: ${truncate(url, 60)}`;
        document.getElementById("chat-card").style.display = "flex";
        document.getElementById("messages").innerHTML = "";

        addMessage("Blog loaded! Ask me anything about it.", "bot");

      } catch (e) {
        setStatus(`❌ ${e.message}`, "error");
      } finally {
        loadBtn.disabled = false;
      }
    }

    async function sendQuestion() {
      const input    = document.getElementById("q-input");
      const question = input.value.trim();
      if (!question || !sessionId) return;

      addMessage(question, "user");
      input.value = "";

      const thinking = addMessage("Thinking...", "bot thinking");
      document.getElementById("send-btn").disabled = true;

      try {
        const res  = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ session_id: sessionId, question, history }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail);

        thinking.textContent  = data.answer;
        thinking.className    = "msg bot";

        // Append to history for multi-turn context
        history.push({ role: "user",      content: question    });
        history.push({ role: "assistant", content: data.answer });

        // Keep history bounded to last 10 turns (20 messages)
        if (history.length > 20) history = history.slice(-20);

      } catch (e) {
        thinking.textContent = `Error: ${e.message}`;
        thinking.className   = "msg bot";
      } finally {
        document.getElementById("send-btn").disabled = false;
      }
    }

    async function clearSession() {
      if (!sessionId) return;
      try {
        await fetch(`/session/${sessionId}`, { method: "DELETE" });
      } catch (_) {}

      sessionId = null;
      history   = [];
      document.getElementById("chat-card").style.display  = "none";
      document.getElementById("messages").innerHTML        = "";
      document.getElementById("url-input").value           = "";
      setStatus("Session cleared. Load a new blog to start again.", "");
    }

    // ---- Helpers ----
    function addMessage(text, cls) {
      const box = document.getElementById("messages");
      const div = document.createElement("div");
      div.className   = `msg ${cls}`;
      div.textContent = text;
      box.appendChild(div);
      box.scrollTop = box.scrollHeight;
      return div;
    }

    function setStatus(text, cls) {
      const el = document.getElementById("status");
      el.textContent = text;
      el.className   = cls;
    }

    function truncate(str, n) {
      return str.length > n ? str.slice(0, n) + "…" : str;
    }
  </script>
</body>
</html>
